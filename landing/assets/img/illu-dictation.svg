<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" role="img" aria-label="Diktataufnahme: ein Mikrofon mit Textzeilen">
  <title>Diktataufnahme</title>
  <rect x="34" y="24" width="172" height="132" rx="16" fill="none" stroke="#7b8f8d" stroke-width="2.5"/>
  <!-- microphone -->
  <rect x="96" y="40" width="26" height="46" rx="13" fill="#d9efe9" stroke="#2f8d80" stroke-width="2.5"/>
  <path d="M86 76a23 23 0 0 0 46 0" fill="none" stroke="#2f8d80" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="109" y1="99" x2="109" y2="112" stroke="#2f8d80" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="95" y1="112" x2="123" y2="112" stroke="#2f8d80" stroke-width="2.5" stroke-linecap="round"/>
  <!-- note lines -->
  <g stroke="#2f8d80" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="60" y1="128" x2="96" y2="128"/>
    <line x1="60" y1="138" x2="112" y2="138"/>
  </g>
  <g stroke="#7b8f8d" stroke-width="3" stroke-linecap="round" opacity="0.75">
    <line x1="126" y1="128" x2="180" y2="128"/>
    <line x1="126" y1="138" x2="150" y2="138"/>
  </g>
</svg>
